name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ─────────────────────────────────────────────
  # Linux — x86_64 glibc binary
  # ─────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "linux-gnu"

      - name: Build release binary
        run: cargo build --release

      - name: Strip debug symbols
        run: strip target/release/wa

      # Upload the raw binary. upload-artifact wraps it in a single zip, so
      # the release job unpacks one layer to recover the binary and then
      # builds the final per-platform archive. No double compression.
      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: wa-linux-x86_64
          path: target/release/wa
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Windows — native MSVC build
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-msvc"

      - name: Build release binary
        run: cargo build --release
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: wa-windows-x86_64
          path: target/release/wa.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # macOS — Intel + Apple Silicon
  # (builds both; each uploaded as its own artifact)
  # ─────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos"

      - name: Build Intel (x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build Apple Silicon (aarch64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Upload Intel binary
        uses: actions/upload-artifact@v6
        with:
          name: wa-macos-x86_64
          path: target/x86_64-apple-darwin/release/wa
          if-no-files-found: error

      - name: Upload ARM binary
        uses: actions/upload-artifact@v6
        with:
          name: wa-macos-aarch64
          path: target/aarch64-apple-darwin/release/wa
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Release — package each binary into a single
  # per-platform archive and attach to the release.
  # Only runs on tag push (v*)
  # ─────────────────────────────────────────────
  release:
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # download-artifact restores the original raw files (it strips the
      # zip wrapper that upload-artifact adds), so each artifact dir holds
      # the bare binary named `wa` / `wa.exe`.
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: false

      - name: Package release archives
        run: |
          mkdir -p release
          # Linux: tarball
          tar czf release/wa-linux-x86_64.tar.gz -C artifacts/wa-linux-x86_64 wa
          # macOS: tarballs (one per arch)
          tar czf release/wa-macos-x86_64.tar.gz  -C artifacts/wa-macos-x86_64  wa
          tar czf release/wa-macos-aarch64.tar.gz -C artifacts/wa-macos-aarch64 wa
          # Windows: zip
          (cd artifacts/wa-windows-x86_64 && zip -q ../../release/wa-windows-x86_64.zip wa.exe)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
